name: Release binaries
# Publish the provider controller binary for every platform, as plain release
# assets.
#
# NOT HOW CROSSPLANE INSTALLS THIS. ci.yml's publish-artifacts job builds the
# xpkg and pushes it to ghcr.io and the Upbound Marketplace, and that is what a
# Provider resource in the cluster resolves. A release asset is not in that path
# and does not replace it.
#
# WHAT IT IS FOR: running the controller outside Crossplane. Reproducing a
# reconcile against a real API with a kubeconfig and a debugger needs no cluster,
# no package manager and no image pull, and building it from source needs the Go
# toolchain and the module cache. Nothing in ~/infra consumes these assets yet;
# they exist so that something can, without a build step.
#
# NO setup-go AND NO RELEASE ACTION. GitHub's runners ship Go, and `gh` is
# already authenticated from GITHUB_TOKEN -- the same reasoning build-image.yml
# gives for `docker login` over a third-party action: one less unpinned
# dependency to keep current.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.0.0'
        required: true

permissions:
  # Required to create the release and upload assets with GITHUB_TOKEN.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    concurrency:
      group: release-crossplane-twilio-binaries
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A tag push carries the version in the ref; a manual run is told it.
      - name: Resolve version
        run: |
          version='${{ inputs.version }}'
          [ -n "$version" ] || version="$GITHUB_REF_NAME"
          case "$version" in
            v*) ;;
            *) echo "version must start with v: $version" >&2; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # CGO off: the binary is copied into other images and must not depend on
      # the libc of whichever one built it.
      - name: Build
        run: |
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -o "dist/crossplane-provider-twilio_${VERSION}_${goos}_${goarch}" \
              ./cmd/provider
          done
          cd dist && sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Idempotent: re-running the same tag uploads over the existing release
      # rather than failing, which is what a retried job should do.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes
          fi

      - name: Summary
        run: |
          echo "Published \`$VERSION\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
