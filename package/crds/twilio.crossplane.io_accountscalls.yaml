spec:
  group: twilio.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - twilio
    kind: AccountsCalls
    listKind: AccountsCallsList
    plural: accountscalls
    singular: accountscalls
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
