    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A AccountsCalls is a managed Twilio resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A AccountsCallsSpec defines the desired state of a AccountsCalls.
            properties:
              forProvider:
                description: |-
                  AccountsCallsParameters are the configurable fields of a AccountsCalls.

                  These are the parameters of the create operation (CreateCall), plus any the
                  update accepts and the create does not. The fields are spelled the way
                  Twilio TAKES them -- PascalCase -- because that is the name the request
                  carries; status.atProvider spells the same values the way Twilio ANSWERS
                  them, in snake_case. Nothing translates between the two, so nothing can
                  drift out of a translation layer.
                properties:
                  ApplicationSid:
                    description: ApplicationSid The SID of the Application resource
                      that will handle the call, if the call will be handled by an
                      application.
                    type: string
                  AsyncAmd:
                    description: 'AsyncAmd Select whether to perform answering machine
                      detection in the background. Default, blocks the execution of
                      the call until Answering Machine Detection is completed. Can
                      be: `true` or `false`.'
                    type: string
                  AsyncAmdStatusCallback:
                    description: AsyncAmdStatusCallback The URL that we should call
                      using the `async_amd_status_callback_method` to notify customer
                      application whether the call was answered by human, machine
                      or fax.
                    type: string
                  AsyncAmdStatusCallbackMethod:
                    description: 'AsyncAmdStatusCallbackMethod The HTTP method we
                      should use when calling the `async_amd_status_callback` URL.
                      Can be: `GET` or `POST` and the default is `POST`.'
                    type: string
                  Byoc:
                    description: Byoc The SID of a BYOC (Bring Your Own Carrier) trunk
                      to route this call with. Note that `byoc` is only meaningful
                      when `to` is a phone number; it will otherwise be ignored. (Beta)
                    type: string
                  CallReason:
                    description: CallReason The Reason for the outgoing call. Use
                      it to specify the purpose of the call that is presented on the
                      called party's phone. (Branded Calls Beta)
                    type: string
                  CallToken:
                    description: CallToken A token string needed to invoke a forwarded
                      call. A call_token is generated when an incoming call is received
                      on a Twilio number. Pass an incoming call's call_token value
                      to a forwarded call via the call_token parameter when creating
                      a new call. A forwarded call should bear the same CallerID of
                      the original incoming call.
                    type: string
                  CallerId:
                    description: CallerId The phone number, SIP address, or Client
                      identifier that made this call. Phone numbers are in [E.164
                      format](https://wwnw.twilio.com/docs/glossary/what-e164) (e.g.,
                      +16175551212). SIP addresses are formatted as `name@company.com`.
                    type: string
                  ClientNotificationUrl:
                    description: ClientNotificationUrl The URL that we should use
                      to deliver `push call notification`.
                    type: string
                  FallbackMethod:
                    description: 'FallbackMethod The HTTP method that we should use
                      to request the `fallback_url`. Can be: `GET` or `POST` and the
                      default is `POST`. If an `application_sid` parameter is present,
                      this parameter is ignored.'
                    type: string
                  FallbackUrl:
                    description: FallbackUrl The URL that we call using the `fallback_method`
                      if an error occurs when requesting or executing the TwiML at
                      `url`. If an `application_sid` parameter is present, this parameter
                      is ignored.
                    type: string
                  From:
                    description: From The phone number or client identifier to use
                      as the caller id. If using a phone number, it must be a Twilio
                      number or a Verified [outgoing caller id](https://www.twilio.com/docs/voice/api/outgoing-caller-ids)
                      for your account. If the `to` parameter is a phone number, `From`
                      must also be a phone number.
                    type: string
                  MachineDetection:
                    description: 'MachineDetection Whether to detect if a human, answering
                      machine, or fax has picked up the call. Can be: `Enable` or
                      `DetectMessageEnd`. Use `Enable` if you would like us to return
                      `AnsweredBy` as soon as the called party is identified. Use
                      `DetectMessageEnd`, if you would like to leave a message on
                      an answering machine. If `send_digits` is provided, this parameter
                      is ignored. For more information, see [Answering Machine Detection](https://www.twilio.com/docs/voice/answering-machine-detection).'
                    type: string
                  MachineDetectionSilenceTimeout:
                    description: 'MachineDetectionSilenceTimeout The number of milliseconds
                      of initial silence after which an `unknown` AnsweredBy result
                      will be returned. Possible Values: 2000-10000. Default: 5000.'
                    type: integer
                  MachineDetectionSpeechEndThreshold:
                    description: 'MachineDetectionSpeechEndThreshold The number of
                      milliseconds of silence after speech activity at which point
                      the speech activity is considered complete. Possible Values:
                      500-5000. Default: 1200.'
                    type: integer
                  MachineDetectionSpeechThreshold:
                    description: 'MachineDetectionSpeechThreshold The number of milliseconds
                      that is used as the measuring stick for the length of the speech
                      activity, where durations lower than this value will be interpreted
                      as a human and longer than this value as a machine. Possible
                      Values: 1000-6000. Default: 2400.'
                    type: integer
                  MachineDetectionTimeout:
                    description: MachineDetectionTimeout The number of seconds that
                      we should attempt to detect an answering machine before timing
                      out and sending a voice request with `AnsweredBy` of `unknown`.
                      The default timeout is 30 seconds.
                    type: integer
                  Method:
                    description: 'Method The HTTP method we should use when calling
                      the `url` parameter''s value. Can be: `GET` or `POST` and the
                      default is `POST`. If an `application_sid` parameter is present,
                      this parameter is ignored.'
                    type: string
                  Passports:
                    description: Passports The STIR/SHAKEN passport for this call,
                      provided as a base64 encoded string. Multiple passports (at
                      max 5) are comma separated and provided as base64 encoded string
                    type: string
                  PathAccountSid:
                    description: PathAccountSid The SID of the [Account](https://www.twilio.com/docs/iam/api/account)
                      that will create the resource.
                    type: string
                  Record:
                    description: Record Whether to record the call. Can be `true`
                      to record the phone call, or `false` to not. The default is
                      `false`. The `recording_url` is sent to the `status_callback`
                      URL.
                    type: boolean
                  RecordingChannels:
                    description: 'RecordingChannels The number of channels in the
                      final recording. Can be: `mono` or `dual`. The default is `mono`.
                      `mono` records both legs of the call in a single channel of
                      the recording file. `dual` records each leg to a separate channel
                      of the recording file. The first channel of a dual-channel recording
                      contains the parent call and the second channel contains the
                      child call.'
                    type: string
                  RecordingConfigurationId:
                    description: RecordingConfigurationId The identifier of the configuration
                      to be used when creating and processing the recording
                    type: string
                  RecordingStatusCallback:
                    description: RecordingStatusCallback The URL that we call when
                      the recording is available to be accessed.
                    type: string
                  RecordingStatusCallbackEvent:
                    description: 'RecordingStatusCallbackEvent The recording status
                      events that will trigger calls to the URL specified in `recording_status_callback`.
                      Can be: `in-progress`, `completed` and `absent`. Defaults to
                      `completed`. Separate multiple values with a space.'
                    items:
                      type: string
                    type: array
                  RecordingStatusCallbackMethod:
                    description: 'RecordingStatusCallbackMethod The HTTP method we
                      should use when calling the `recording_status_callback` URL.
                      Can be: `GET` or `POST` and the default is `POST`.'
                    type: string
                  RecordingTrack:
                    description: 'RecordingTrack The audio track to record for the
                      call. Can be: `inbound`, `outbound` or `both`. The default is
                      `both`. `inbound` records the audio that is received by Twilio.
                      `outbound` records the audio that is generated from Twilio.
                      `both` records the audio that is received and generated by Twilio.'
                    type: string
                  SendDigits:
                    description: 'SendDigits The string of keys to dial after connecting
                      to the number, with a maximum length of 32 digits. Valid digits
                      in the string include any digit (`0`-`9`), ''`A`'', ''`B`'',
                      ''`C`'', ''`D`'', ''`#`'', and ''`*`''. You can also use ''`w`''
                      to insert a half-second pause and ''`W`'' to insert a one-second
                      pause. For example, to pause for one second after connecting
                      and then dial extension 1234 followed by the # key, set this
                      parameter to `W1234#`. Be sure to URL-encode this string because
                      the ''`#`'' character has special meaning in a URL. If both
                      `SendDigits` and `MachineDetection` parameters are provided,
                      then `MachineDetection` will be ignored.'
                    type: string
                  SipAuthPassword:
                    description: SipAuthPassword The password required to authenticate
                      the user account specified in `sip_auth_username`.
                    type: string
                  SipAuthUsername:
                    description: SipAuthUsername The username used to authenticate
                      the caller making a SIP call.
                    type: string
                  Status:
                    description: Status
                    type: string
                  StatusCallback:
                    description: StatusCallback The URL we should call using the `status_callback_method`
                      to send status information to your application. If no `status_callback_event`
                      is specified, we will send the `completed` status. If an `application_sid`
                      parameter is present, this parameter is ignored. URLs must contain
                      a valid hostname (underscores are not permitted).
                    type: string
                  StatusCallbackEvent:
                    description: 'StatusCallbackEvent The call progress events that
                      we will send to the `status_callback` URL. Can be: `initiated`,
                      `ringing`, `answered`, and `completed`. If no event is specified,
                      we send the `completed` status. If you want to receive multiple
                      events, specify each one in a separate `status_callback_event`
                      parameter. See the code sample for [monitoring call progress](https://www.twilio.com/docs/voice/api/call-resource?code-sample=code-create-a-call-resource-and-specify-a-statuscallbackevent&code-sdk-version=json).
                      If an `application_sid` is present, this parameter is ignored.'
                    items:
                      type: string
                    type: array
                  StatusCallbackMethod:
                    description: 'StatusCallbackMethod The HTTP method we should use
                      when calling the `status_callback` URL. Can be: `GET` or `POST`
                      and the default is `POST`. If an `application_sid` parameter
                      is present, this parameter is ignored.'
                    type: string
                  TimeLimit:
                    description: TimeLimit The maximum duration of the call in seconds.
                      Constraints depend on account and configuration.
                    type: integer
                  Timeout:
                    description: Timeout The integer number of seconds that we should
                      allow the phone to ring before assuming there is no answer.
                      The default is `60` seconds and the maximum is `600` seconds.
                      For some call flows, we will add a 5-second buffer to the timeout
                      value you provide. For this reason, a timeout value of 10 seconds
                      could result in an actual timeout closer to 15 seconds. You
                      can set this to a short time, such as `15` seconds, to hang
                      up before reaching an answering machine or voicemail.
                    type: integer
                  To:
                    description: To The phone number, SIP address, or client identifier
                      to call.
                    type: string
                  Trim:
                    description: 'Trim Whether to trim any leading and trailing silence
                      from the recording. Can be: `trim-silence` or `do-not-trim`
                      and the default is `trim-silence`.'
                    type: string
                  Twiml:
                    description: Twiml TwiML instructions for the call Twilio will
                      use without fetching Twiml from url parameter. If both `twiml`
                      and `url` are provided then `twiml` parameter will be ignored.
                      Max 4000 characters.
                    type: string
                  Url:
                    description: Url The absolute URL that returns the TwiML instructions
                      for the call. We will call this URL using the `method` when
                      the call connects. For more information, see the [Url Parameter](https://www.twilio.com/docs/voice/make-calls#specify-a-url-parameter)
                      section in [Making Calls](https://www.twilio.com/docs/voice/make-calls).
                    type: string
                required:
                - From
                - To
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A AccountsCallsStatus represents the observed state of a
              AccountsCalls.
            properties:
              atProvider:
                description: |-
                  AccountsCallsObservation are the observable fields of a AccountsCalls.

                  These are the properties of what the read (FetchCall) answers -- what IS,
                  including the fields a person also writes. The controller diffs the two.
                properties:
                  account_sid:
                    type: string
                  answered_by:
                    type: string
                  api_version:
                    type: string
                  caller_name:
                    type: string
                  date_created:
                    type: string
                  date_updated:
                    type: string
                  direction:
                    type: string
                  duration:
                    type: string
                  end_time:
                    type: string
                  forwarded_from:
                    type: string
                  from:
                    type: string
                  from_formatted:
                    type: string
                  group_sid:
                    type: string
                  parent_call_sid:
                    type: string
                  phone_number_sid:
                    type: string
                  price:
                    type: string
                  price_unit:
                    type: string
                  queue_time:
                    type: string
                  sid:
                    type: string
                  start_time:
                    type: string
                  status:
                    type: string
                  subresource_uris:
                    type: string
                  to:
                    type: string
                  to_formatted:
                    type: string
                  trunk_sid:
                    type: string
                  uri:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
