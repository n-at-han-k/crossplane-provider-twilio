                      must also be a phone number. If `to` is sip address, this value
                      of `from` should be a username portion to be used to populate
                      the P-Asserted-Identity header that is passed to the SIP endpoint.
                    type: string
                  Hold:
                    description: 'Hold Whether the participant should be on hold.
                      Can be: `true` or `false`. `true` puts the participant on hold,
                      and `false` lets them rejoin the conference.'
                    type: boolean
                  HoldMethod:
                    description: 'HoldMethod The HTTP method we should use to call
                      `hold_url`. Can be: `GET` or `POST` and the default is `GET`.'
                    type: string
                  HoldUrl:
                    description: HoldUrl The URL we call using the `hold_method` for
                      music that plays when the participant is on hold. The URL may
                      return an MP3 file, a WAV file, or a TwiML document that contains
                      `<Play>`, `<Say>`, `<Pause>`, or `<Redirect>` verbs.
                    type: string
                  JitterBufferSize:
                    description: 'JitterBufferSize Jitter buffer size for the connecting
                      participant. Twilio will use this setting to apply Jitter Buffer
                      before participant''s audio is mixed into the conference. Can
                      be: `off`, `small`, `medium`, and `large`. Default to `large`.'
                    type: string
                  Label:
                    description: Label A label for this participant. If one is supplied,
                      it may subsequently be used to fetch, update or delete the participant.
                    type: string
                  MachineDetection:
                    description: 'MachineDetection Whether to detect if a human, answering
                      machine, or fax has picked up the call. Can be: `Enable` or
                      `DetectMessageEnd`. Use `Enable` if you would like us to return
                      `AnsweredBy` as soon as the called party is identified. Use
                      `DetectMessageEnd`, if you would like to leave a message on
                      an answering machine. For more information, see [Answering Machine
                      Detection](https://www.twilio.com/docs/voice/answering-machine-detection).'
                    type: string
                  MachineDetectionSilenceTimeout:
                    description: 'MachineDetectionSilenceTimeout The number of milliseconds
                      of initial silence after which an `unknown` AnsweredBy result
                      will be returned. Possible Values: 2000-10000. Default: 5000.'
                    type: integer
                  MachineDetectionSpeechEndThreshold:
                    description: 'MachineDetectionSpeechEndThreshold The number of
                      milliseconds of silence after speech activity at which point
                      the speech activity is considered complete. Possible Values:
                      500-5000. Default: 1200.'
                    type: integer
                  MachineDetectionSpeechThreshold:
                    description: 'MachineDetectionSpeechThreshold The number of milliseconds
                      that is used as the measuring stick for the length of the speech
                      activity, where durations lower than this value will be interpreted
                      as a human and longer than this value as a machine. Possible
                      Values: 1000-6000. Default: 2400.'
                    type: integer
                  MachineDetectionTimeout:
                    description: MachineDetectionTimeout The number of seconds that
                      we should attempt to detect an answering machine before timing
                      out and sending a voice request with `AnsweredBy` of `unknown`.
                      The default timeout is 30 seconds.
                    type: integer
                  MaxParticipants:
                    description: MaxParticipants The maximum number of participants
                      in the conference. Can be a positive integer from `2` to `250`.
                      The default value is `250`.
                    type: integer
                  Muted:
                    description: Muted Whether the agent is muted in the conference.
                      Can be `true` or `false` and the default is `false`.
                    type: boolean
                  Passports:
                    description: Passports The STIR/SHAKEN passport for this call,
                      provided as a base64 encoded string. Multiple passports (at
                      max 5) are comma separated and provided as base64 encoded string
                    type: string
                  PathAccountSid:
                    description: PathAccountSid The SID of the [Account](https://www.twilio.com/docs/iam/api/account)
