                properties:
                  AmdStatusCallback:
                    description: AmdStatusCallback The URL that we should call using
                      the `amd_status_callback_method` to notify customer application
                      whether the call was answered by human, machine or fax.
                    type: string
                  AmdStatusCallbackMethod:
                    description: 'AmdStatusCallbackMethod The HTTP method we should
                      use when calling the `amd_status_callback` URL. Can be: `GET`
                      or `POST` and the default is `POST`.'
                    type: string
                  AnnounceMethod:
                    description: 'AnnounceMethod The HTTP method we should use to
                      call `announce_url`. Can be: `GET` or `POST` and defaults to
                      `POST`.'
                    type: string
                  AnnounceUrl:
                    description: AnnounceUrl The URL we call using the `announce_method`
                      for an announcement to the participant. The URL may return an
                      MP3 file, a WAV file, or a TwiML document that contains `<Play>`,
                      `<Say>`, `<Pause>`, or `<Redirect>` verbs.
                    type: string
                  Beep:
                    description: 'Beep Whether to play a notification beep to the
                      conference when the participant joins. Can be: `true`, `false`,
                      `onEnter`, or `onExit`. The default value is `true`.'
                    type: string
                  BeepOnExit:
                    description: 'BeepOnExit Whether to play a notification beep to
                      the conference when the participant exits. Can be: `true` or
                      `false`.'
                    type: boolean
                  Byoc:
                    description: Byoc The SID of a BYOC (Bring Your Own Carrier) trunk
                      to route this call with. Note that `byoc` is only meaningful
                      when `to` is a phone number; it will otherwise be ignored. (Beta)
                    type: string
                  CallReason:
                    description: CallReason The Reason for the outgoing call. Use
                      it to specify the purpose of the call that is presented on the
                      called party's phone. (Branded Calls Beta)
                    type: string
                  CallSidToCoach:
                    description: CallSidToCoach The SID of the participant who is
                      being `coached`. The participant being coached is the only participant
                      who can hear the participant who is `coaching`.
                    type: string
                  CallToken:
                    description: CallToken A token string needed to invoke a forwarded
                      call. A call_token is generated when an incoming call is received
                      on a Twilio number. Pass an incoming call's call_token value
                      to a forwarded call via the call_token parameter when creating
                      a new call. A forwarded call should bear the same CallerID of
                      the original incoming call.
                    type: string
                  CallerDisplayName:
                    description: CallerDisplayName The name that populates the display
                      name in the From header. Must be between 2 and 255 characters.
                      Only applicable for calls to sip address.
                    type: string
                  CallerId:
                    description: CallerId The phone number, Client identifier, or
                      username portion of SIP address that made this call. Phone numbers
                      are in [E.164](https://www.twilio.com/docs/glossary/what-e164)
                      format (e.g., +16175551212). Client identifiers are formatted
                      `client:name`. If using a phone number, it must be a Twilio
                      number or a Verified [outgoing caller id](https://www.twilio.com/docs/voice/api/outgoing-caller-ids)
                      for your account. If the `to` parameter is a phone number, `callerId`
                      must also be a phone number. If `to` is sip address, this value
                      of `callerId` should be a username portion to be used to populate
                      the From header that is passed to the SIP endpoint.
                    type: string
                  ClientNotificationUrl:
                    description: ClientNotificationUrl The URL that we should use
                      to deliver `push call notification`.
                    type: string
                  Coaching:
                    description: 'Coaching Whether the participant is coaching another
                      call. Can be: `true` or `false`. If not present, defaults to
                      `false` unless `call_sid_to_coach` is defined. If `true`, `call_sid_to_coach`
                      must be defined.'
                    type: boolean
                  ConferenceRecord:
                    description: 'ConferenceRecord Whether to record the conference
                      the participant is joining. Can be: `true`, `false`, `record-from-start`,
                      and `do-not-record`. The default value is `false`.'
                    type: string
                  ConferenceRecordingStatusCallback:
                    description: ConferenceRecordingStatusCallback The URL we should
                      call using the `conference_recording_status_callback_method`
                      when the conference recording is available.
                    type: string
                  ConferenceRecordingStatusCallbackEvent:
                    description: 'ConferenceRecordingStatusCallbackEvent The conference
                      recording state changes that generate a call to `conference_recording_status_callback`.
                      Can be: `in-progress`, `completed`, `failed`, and `absent`.
                      Separate multiple values with a space, ex: `''in-progress completed
                      failed''`'
                    items:
                      type: string
                    type: array
                  ConferenceRecordingStatusCallbackMethod:
                    description: 'ConferenceRecordingStatusCallbackMethod The HTTP
                      method we should use to call `conference_recording_status_callback`.
                      Can be: `GET` or `POST` and defaults to `POST`.'
                    type: string
                  ConferenceSid:
                    description: ConferenceSid The SID of the participant's conference.
                    type: string
                  ConferenceStatusCallback:
                    description: ConferenceStatusCallback The URL we should call using
                      the `conference_status_callback_method` when the conference
                      events in `conference_status_callback_event` occur. Only the
                      value set by the first participant to join the conference is
                      used. Subsequent `conference_status_callback` values are ignored.
                    type: string
                  ConferenceStatusCallbackEvent:
                    description: 'ConferenceStatusCallbackEvent The conference state
                      changes that should generate a call to `conference_status_callback`.
                      Can be: `start`, `end`, `join`, `leave`, `mute`, `hold`, `modify`,
                      `speaker`, and `announcement`. Separate multiple values with
                      a space. Defaults to `start end`.'
                    items:
                      type: string
                    type: array
                  ConferenceStatusCallbackMethod:
                    description: 'ConferenceStatusCallbackMethod The HTTP method we
                      should use to call `conference_status_callback`. Can be: `GET`
                      or `POST` and defaults to `POST`.'
                    type: string
                  ConferenceTrim:
                    description: 'ConferenceTrim Whether to trim leading and trailing
                      silence from the conference recording. Can be: `trim-silence`
                      or `do-not-trim` and defaults to `trim-silence`.'
                    type: string
                  EarlyMedia:
                    description: 'EarlyMedia Whether to allow an agent to hear the
                      state of the outbound call, including ringing or disconnect
                      messages. Can be: `true` or `false` and defaults to `true`.'
                    type: boolean
                  EmergencyAddress:
                    description: 'EmergencyAddress The emergency caller''s street
                      address including street number and street name. Note: If the
                      value exceeds 60 characters, only the first 60 characters will
                      be used.'
                    type: string
                  EmergencyCallerLocation:
                    description: 'EmergencyCallerLocation The emergency caller''s
                      physical location description within a building or facility.
                      Note: If the value exceeds 20 characters, only the first 20
                      characters will be used.'
                    type: string
                  EmergencyCallerPosition:
                    description: 'EmergencyCallerPosition The emergency caller''s
                      GPS coordinates in decimal degrees format. Format: \\\"latitude
                      longitude\\\" (space-separated) - Latitude: decimal degrees,
                      range -90.0 to +90.0 (negative for South, positive for North)
                      - Longitude: decimal degrees, range -180.0 to +180.0 (negative
                      for West, positive for East) - Precision: up to 6 decimal places
                      recommended for meter-level accuracy Note: If the value exceeds
                      150 characters, only the first 150 characters will be used.'
                    type: string
                  EmergencyCity:
                    description: 'EmergencyCity The emergency caller''s city or municipality
                      name. Should be the official city name as recognized by local
                      authorities. Used in combination with state and country for
                      emergency call routing. Note: If the value exceeds 20 characters,
                      only the first 20 characters will be used.'
                    type: string
                  EmergencyCountry:
                    description: 'EmergencyCountry The emergency caller''s country.
                      Currently supported US and CA only. Note: If the value exceeds
                      20 characters, only the first 20 characters will be used.'
                    type: string
                  EmergencyName:
                    description: 'EmergencyName The emergency caller''s organization
                      or entity name. Note: If the value exceeds 20 characters, only
                      the first 20 characters will be used.'
                    type: string
                  EmergencyState:
                    description: 'EmergencyState The emergency caller''s state or
                      province. Note: If the value exceeds 20 characters, only the
                      first 20 characters will be used.'
                    type: string
                  EmergencyZipCode:
                    description: 'EmergencyZipCode The emergency caller''s postal
                      code or ZIP code. Note: If the value exceeds 20 characters,
                      only the first 20 characters will be used.'
                    type: string
                  EndConferenceOnExit:
                    description: 'EndConferenceOnExit Whether to end the conference
                      when the participant leaves. Can be: `true` or `false` and defaults
                      to `false`.'
                    type: boolean
                  From:
                    description: From The phone number, Client identifier, or username
                      portion of SIP address that made this call. Phone numbers are
                      in [E.164](https://www.twilio.com/docs/glossary/what-e164) format
                      (e.g., +16175551212). Client identifiers are formatted `client:name`.
                      If using a phone number, it must be a Twilio number or a Verified
                      [outgoing caller id](https://www.twilio.com/docs/voice/api/outgoing-caller-ids)
