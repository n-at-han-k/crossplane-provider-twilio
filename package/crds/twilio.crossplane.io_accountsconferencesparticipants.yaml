                    type: boolean
                  RecordingChannels:
                    description: 'RecordingChannels The recording channels for the
                      final recording. Can be: `mono` or `dual` and the default is
                      `mono`.'
                    type: string
                  RecordingConfigurationId:
                    description: RecordingConfigurationId The identifier of the configuration
                      to be used when creating and processing the recording
                    type: string
                  RecordingStatusCallback:
                    description: RecordingStatusCallback The URL that we should call
                      using the `recording_status_callback_method` when the recording
                      status changes.
                    type: string
                  RecordingStatusCallbackEvent:
                    description: 'RecordingStatusCallbackEvent The recording state
                      changes that should generate a call to `recording_status_callback`.
                      Can be: `started`, `in-progress`, `paused`, `resumed`, `stopped`,
                      `completed`, `failed`, and `absent`. Separate multiple values
                      with a space, ex: `''in-progress completed failed''`.'
                    items:
                      type: string
                    type: array
                  RecordingStatusCallbackMethod:
                    description: 'RecordingStatusCallbackMethod The HTTP method we
                      should use when we call `recording_status_callback`. Can be:
                      `GET` or `POST` and defaults to `POST`.'
                    type: string
                  RecordingTrack:
                    description: 'RecordingTrack The audio track to record for the
                      call. Can be: `inbound`, `outbound` or `both`. The default is
                      `both`. `inbound` records the audio that is received by Twilio.
                      `outbound` records the audio that is sent from Twilio. `both`
                      records the audio that is received and sent by Twilio.'
                    type: string
                  Region:
                    description: Region The [region](https://support.twilio.com/hc/en-us/articles/223132167-How-global-low-latency-routing-and-region-selection-work-for-conferences-and-Client-calls)
                      where we should mix the recorded audio. Can be:`us1`, `us2`,
                      `ie1`, `de1`, `sg1`, `br1`, `au1`, or `jp1`.
                    type: string
                  SipAuthPassword:
                    description: SipAuthPassword The SIP password for authentication.
                    type: string
                  SipAuthUsername:
                    description: SipAuthUsername The SIP username used for authentication.
                    type: string
                  StartConferenceOnEnter:
                    description: 'StartConferenceOnEnter Whether to start the conference
                      when the participant joins, if it has not already started. Can
                      be: `true` or `false` and the default is `true`. If `false`
                      and the conference has not started, the participant is muted
                      and hears background music until another participant starts
                      the conference.'
                    type: boolean
                  StatusCallback:
                    description: StatusCallback The URL we should call using the `status_callback_method`
                      to send status information to your application.
                    type: string
                  StatusCallbackEvent:
                    description: 'StatusCallbackEvent The conference state changes
                      that should generate a call to `status_callback`. Can be: `initiated`,
                      `ringing`, `answered`, and `completed`. Separate multiple values
                      with a space. The default value is `completed`.'
                    items:
                      type: string
                    type: array
                  StatusCallbackMethod:
                    description: 'StatusCallbackMethod The HTTP method we should use
                      to call `status_callback`. Can be: `GET` and `POST` and defaults
                      to `POST`.'
                    type: string
                  TimeLimit:
                    description: TimeLimit The maximum duration of the call in seconds.
                      Constraints depend on account and configuration.
                    type: integer
                  Timeout:
                    description: Timeout The number of seconds that we should allow
                      the phone to ring before assuming there is no answer. Can be
                      an integer between `5` and `600`, inclusive. The default value
                      is `60`. We always add a 5-second timeout buffer to outgoing
                      calls, so value of 10 would result in an actual timeout that
                      was closer to 15 seconds.
                    type: integer
                  To:
                    description: To The phone number, SIP address, Client, TwiML App
                      identifier that received this call. Phone numbers are in [E.164](https://www.twilio.com/docs/glossary/what-e164)
                      format (e.g., +16175551212). SIP addresses are formatted as
                      `sip:name@company.com`. Client identifiers are formatted `client:name`.
                      TwiML App identifiers are formatted `app:<APP_SID>`. [Custom
                      parameters](https://www.twilio.com/docs/voice/api/conference-participant-resource#custom-parameters)
                      may also be specified.
                    type: string
                  Trim:
                    description: 'Trim Whether to trim any leading and trailing silence
                      from the participant recording. Can be: `trim-silence` or `do-not-trim`
                      and the default is `trim-silence`.'
                    type: string
                  WaitMethod:
                    description: WaitMethod The HTTP method we should use to call
                      `wait_url`. Can be `GET` or `POST` and the default is `POST`.
                      When using a static audio file, this should be `GET` so that
                      we can cache the file.
                    type: string
                  WaitUrl:
                    description: WaitUrl The URL that Twilio calls using the `wait_method`
                      before the conference has started. The URL may return an MP3
                      file, a WAV file, or a TwiML document. The default value is
                      the URL of our standard hold music. If you do not want anything
                      to play while waiting for the conference to start, specify an
                      empty string by setting `wait_url` to `''`. For more details
                      on the allowable verbs within the `waitUrl`, see the `waitUrl`
                      attribute in the [<Conference> TwiML instruction](https://www.twilio.com/docs/voice/twiml/conference#attributes-waiturl).
                    type: string
                required:
                - ConferenceSid
                - From
                - To
                type: object
