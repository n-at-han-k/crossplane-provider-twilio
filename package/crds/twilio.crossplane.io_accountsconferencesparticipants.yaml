            properties:
              forProvider:
                description: |-
                  AccountsConferencesParticipantsParameters are the configurable fields of a AccountsConferencesParticipants.

                  These are the parameters of the create operation (CreateParticipant), plus any the
                  update accepts and the create does not. The fields are spelled the way
                  Twilio TAKES them -- PascalCase -- because that is the name the request
                  carries; status.atProvider spells the same values the way Twilio ANSWERS
