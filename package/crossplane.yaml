apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-twilio
  annotations:
    # NOTE: this block IS the Marketplace listing. Everything here is rendered
    # publicly, so keep it accurate.
    meta.crossplane.io/maintainer: n-at-han-k (https://github.com/n-at-han-k)
    meta.crossplane.io/source: github.com/n-at-han-k/crossplane-provider-twilio
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Manage Twilio Identity Server as Kubernetes resources.
    meta.crossplane.io/readme: |
      `provider-twilio` manages Twilio Identity Server as Kubernetes
      resources, so tenants, organizations and applications can be declared
      alongside the rest of your cluster and reconciled by Crossplane.

      It is GENERATED from the API descriptions Twilio publishes with the
      server itself, so what it can manage is what those documents describe --
      no more, and nothing hand-maintained that can drift from them.

      ## Managed resources


      * `AccountsAddresses`


      * `AccountsApplications`


      * `AccountsCalls`


      * `AccountsCallsRecordings`


      * `AccountsConferencesParticipants`


      * `AccountsIncomingPhoneNumbers`


      * `AccountsIncomingPhoneNumbersAssignedAddOns`


      * `AccountsKeys`


      * `AccountsMessages`


      * `AccountsQueues`


      * `AccountsSIPCredentialLists`


      * `AccountsSIPCredentialListsCredentials`


      * `AccountsSIPDomains`


      * `AccountsSIPDomainsAuthCallsCredentialListMappings`


      * `AccountsSIPDomainsAuthCallsIpAccessControlListMappings`


      * `AccountsSIPDomainsAuthRegistrationsCredentialListMappings`


      * `AccountsSIPDomainsCredentialListMappings`


      * `AccountsSIPDomainsIpAccessControlListMappings`


      * `AccountsSIPIpAccessControlLists`


      * `AccountsSIPIpAccessControlListsIpAddresses`


      * `AccountsSigningKeys`


      * `AccountsUsageTriggers`


      ## Getting started

      Install the provider, then give it an endpoint and a credential. Unlike
      a single-key API, Twilio needs to be told WHERE it is as well as who
      you are, so the secret is one JSON document rather than a bare token:

      ```yaml
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-twilio
      spec:
        package: xpkg.upbound.io/n-at-han-k/provider-twilio:v0.1.0
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: twilio-creds
        namespace: crossplane-system
      type: Opaque
      stringData:
        credentials: |
          {
            "endpoint": "https://identity.example.com/api/server/v1",
            "username": "admin",
            "password": "admin"
          }
      ---
      apiVersion: twilio.crossplane.io/v1alpha1
      kind: ClusterProviderConfig
      metadata:
        name: default
      spec:
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: twilio-creds
            key: credentials
      ```

      `token` and `apiKey` are accepted in place of `username`/`password`.

      See the `examples/` directory in the source repository for a manifest per
      managed resource.
spec:
  # SafeStart, NOT "safe-start". crossplane/provider-template ships the
  # kebab-case spelling, which is not the enum value: Crossplane silently
  # prunes it, the ProviderRevision comes up with no capabilities, and the RBAC
  # manager therefore never grants the CRD get/list/watch that a safe-start
  # provider needs. The binary still runs its crd-gate, which then cannot sync
  # and the container CrashLoopBackOffs with "failed to wait for crd-gate
  # caches to sync".
  capabilities:
    - SafeStart
